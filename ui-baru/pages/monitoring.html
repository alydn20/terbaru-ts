<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Harga Emas Realtime | PemulaOLD</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/icon.png?v=3">
  <meta name="apple-mobile-web-app-title" content="Harga PemulaOLD">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/ui-baru/dist/app.css?v={{VER}}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('goldmonitor_theme')||'dark'}catch(e){}</script>
  <!--SESSION_BOOT-->
</head>
<body class="min-h-screen pb-[calc(76px+env(safe-area-inset-bottom))] lg:pb-0">

  <!-- ============================== BAR ATAS ============================== -->
  <header class="sticky top-0 z-30 border-b border-line/[0.07] bg-bg/90 backdrop-blur-xl" style="padding-top: env(safe-area-inset-top)">
    <div class="mx-auto flex max-w-[1400px] items-center gap-2.5 px-3 py-1.5 lg:gap-3 lg:px-4 lg:py-2.5">
      <div class="relative shrink-0">
        <svg viewBox="0 0 24 24" class="h-7 w-7 lg:h-8 lg:w-8" aria-hidden="true"><rect x="4.5" y="3" width="3.75" height="18" rx="0.75" fill="#f7931a"/><rect x="10.1" y="4.9" width="8.25" height="8.25" rx="1.1" fill="none" stroke="#f7931a" stroke-width="3.4"/></svg>
        <span id="liveDot" class="absolute -right-0.5 -top-0.5 h-2.5 w-2.5 rounded-full bg-up ring-2 ring-bg" title="Data live"></span>
      </div>
      <div class="min-w-0 flex-1 leading-tight">
        <div class="truncate text-sm font-extrabold lg:text-[15px]">Harga PemulaOLD</div>
        <button id="sisaHari" class="hidden items-center gap-1.5 text-[11px] font-semibold"></button>
      </div>
      <!-- desktop: Promo / News / Lainnya pindah ke sini (menu bawah disembunyikan) -->
      <div id="topNav" class="hidden items-center gap-1 lg:flex"></div>
      <button id="btnUiLama" class="icon-btn h-9 w-9 text-muted lg:h-10 lg:w-auto lg:gap-1.5 lg:px-3 lg:text-xs lg:font-semibold" title="Kembali ke tampilan lama" aria-label="Kembali ke tampilan lama"></button>
      <button id="btnAdminWa" class="icon-btn h-9 w-9 border-up/30 bg-up/10 text-up lg:h-10 lg:w-10" aria-label="Hubungi admin lewat WhatsApp"></button>
    </div>
  </header>

  <main class="mx-auto max-w-[1400px] px-2.5 pt-2 lg:px-4 lg:pt-3">
    <!-- pemberitahuan dari admin -->
    <div id="notifs" class="mb-2 flex flex-col gap-2 empty:hidden"></div>

    <!-- HP: harga + nominal + grafik muat dalam satu layar. Desktop: harga di atas, grafik selebar layar, lalu riwayat -->
    <div class="grid grid-cols-1 gap-2 lg:gap-4">
      <!-- ============================== KOLOM KIRI ============================== -->
      <div class="flex min-w-0 flex-col gap-2 lg:gap-4">

        <!-- HARGA UTAMA: semua isi kartu rata tengah dan kotak kecil berukuran sama -->
        <section id="sec-harga" class="card min-w-0 p-2 lg:grid lg:grid-cols-[minmax(0,1fr)_minmax(0,0.95fr)_minmax(0,1.25fr)] lg:items-center lg:gap-x-5 lg:px-4 lg:py-3" aria-label="Harga emas">
          <div class="grid grid-cols-2 gap-1.5 lg:col-start-1 lg:row-start-1 lg:gap-2">
            <div id="buyCard" class="tile min-w-0 overflow-hidden px-2 py-1.5 text-center lg:px-3 lg:py-2">
              <div class="flex items-center justify-center gap-1.5"><span class="label flex items-center gap-1 text-[10px]"><span class="h-1.5 w-1.5 rounded-full bg-up"></span>Beli</span><span id="buyChange" class="hidden"></span></div>
              <div class="num whitespace-nowrap font-mono text-[clamp(1rem,4.9vw,1.6rem)] font-extrabold leading-tight tracking-tight"><span class="mr-0.5 text-[0.55em] font-semibold text-muted">Rp</span><span id="buyPrice">—</span></div>
            </div>
            <div id="sellCard" class="tile min-w-0 overflow-hidden px-2 py-1.5 text-center lg:px-3 lg:py-2">
              <div class="flex items-center justify-center gap-1.5"><span class="label flex items-center gap-1 text-[10px]"><span class="h-1.5 w-1.5 rounded-full bg-sky"></span>Jual</span><span id="sellChange" class="hidden"></span></div>
              <div class="num whitespace-nowrap font-mono text-[clamp(1rem,4.9vw,1.6rem)] font-extrabold leading-tight tracking-tight"><span class="mr-0.5 text-[0.55em] font-semibold text-muted">Rp</span><span id="sellPrice">—</span></div>
            </div>
          </div>

          <!-- jam + status promo -->
          <div class="mt-2 flex items-center justify-center gap-3 lg:col-start-1 lg:row-start-2">
            <span class="num font-mono text-xl font-extrabold leading-none lg:text-2xl"><span id="clkH">--</span>:<span id="clkM">--</span>:<span id="clkS">--</span></span>
            <span id="clkDate" class="whitespace-nowrap text-[10px] leading-tight text-muted">&nbsp;</span>
            <span id="promoStatus" class="pill shrink-0 bg-line/10 px-2 py-0.5 text-[11px] text-muted" title="Status promo">PROMO —</span>
          </div>

          <!-- info harga: kotak seragam 3 per baris; sisa di baris terakhir di tengah -->
          <div id="chips" class="mt-2 flex flex-wrap justify-center gap-1 lg:col-start-2 lg:row-span-2 lg:row-start-1 lg:mt-0">
            <div class="stat"><span class="stat-k">USD/IDR <span id="usdIdrChange" class="hidden"></span></span><span id="usdIdr" class="stat-v text-sky">—</span></div>
            <div class="stat"><span class="stat-k">Tertinggi</span><span id="dayHigh" class="stat-v text-up">—</span></div>
            <div class="stat"><span class="stat-k">Terendah</span><span id="dayLow" class="stat-v text-down">—</span></div>
            <div id="chipLimit" class="stat hidden"><span class="stat-k">Limit</span><span id="limitVal" class="stat-v text-gold"></span></div>
            <div id="chipMarkup" class="stat hidden"><span id="markupLabel" class="stat-k">Markup</span><span id="markupVal" class="stat-v text-gold"></span></div>
            <div id="chipSpread" class="stat"><span class="stat-k">Spread</span><span id="spreadVal" class="stat-v">—</span></div>
            <div id="chipOn" class="stat hidden"><span id="onLabel" class="stat-k">Titik ON</span><span id="lowestOnVal" class="stat-v text-up"></span></div>
          </div>

          <!-- untung per nominal -->
          <div class="mt-2 border-t border-dashed border-line/[0.12] pt-1.5 lg:col-start-3 lg:row-span-2 lg:row-start-1 lg:mt-0 lg:border-l lg:border-t-0 lg:pl-5 lg:pt-0">
            <div class="relative mb-1 text-center">
              <h2 class="label text-[10px] lg:text-[11px]">Untung per nominal</h2>
              <button id="btnNominal" class="absolute right-0.5 top-1/2 -translate-y-1/2 text-[11px] font-semibold text-gold">Atur</button>
            </div>
            <div id="nominals" class="flex flex-wrap justify-center gap-1 lg:gap-2">
              <div class="py-2 text-sm text-muted">Memuat...</div>
            </div>
          </div>
        </section>

      </div>

      <!-- ============================== KOLOM KANAN ============================== -->
      <div class="flex min-w-0 flex-col gap-2 lg:gap-4">
        <!-- GRAFIK: di HP mengisi sisa layar (diatur monitoring.js) -->
        <section id="sec-grafik" class="card overflow-hidden" aria-label="Grafik XAU/USD">
          <div class="hidden items-center justify-between px-4 py-3 lg:flex">
            <h2 class="label">Grafik XAU/USD</h2>
            <button id="btnIndicator" class="text-xs font-semibold text-gold">Indikator</button>
          </div>
          <div id="tvChart" class="h-[360px] bg-card2 lg:h-[calc(100vh-190px)] lg:border-t lg:border-line/[0.07]"></div>
        </section>

        <!-- RIWAYAT -->
        <section id="sec-riwayat" class="card overflow-hidden" aria-label="Riwayat perubahan harga">
          <div class="flex flex-wrap items-center gap-3 px-4 py-3">
            <h2 class="label mr-auto">Riwayat perubahan</h2>
            <div class="seg" id="histMode">
              <button data-mode="price" aria-pressed="true">Harga emas</button>
              <button data-mode="usdidr" aria-pressed="false">USD/IDR</button>
            </div>
          </div>
          <div class="overflow-x-auto border-t border-line/[0.07]">
            <table class="w-full min-w-[440px] text-sm">
              <thead id="histHead" class="bg-card2 text-left text-[10px] uppercase tracking-wider text-muted"></thead>
              <tbody id="histBody" class="divide-y divide-line/[0.06]"></tbody>
            </table>
          </div>
          <div id="histPager" class="flex items-center justify-between gap-2 border-t border-line/[0.07] px-4 py-3 text-xs">
            <button id="histNewer" class="btn-ghost px-3 py-2 text-xs">Lebih baru</button>
            <span id="histInfo" class="text-muted"></span>
            <button id="histOlder" class="btn-ghost px-3 py-2 text-xs">Lebih lama</button>
          </div>
        </section>
      </div>
    </div>
    <p class="py-6 text-center text-[11px] text-muted">PemulaOLD · Harga emas realtime</p>
  </main>

  <!-- ============================== NAVIGASI BAWAH ============================== -->
  <nav id="bottomNav" class="fixed inset-x-0 bottom-0 z-30 lg:hidden border-t border-line/[0.08] bg-card/95 backdrop-blur-xl" style="padding-bottom: env(safe-area-inset-bottom)" aria-label="Navigasi">
    <div class="mx-auto grid h-16 max-w-xl grid-cols-5">
      <button data-nav="harga" class="nav-item">Harga</button>
      <button data-nav="grafik" class="nav-item">Grafik</button>
      <button data-nav="promo" class="nav-item lg:h-12 lg:w-16 lg:rounded-xl lg:hover:bg-card2 lg:hover:text-ink">Promo<span id="badgePromo" class="badge hidden"></span></button>
      <button data-nav="news" class="nav-item lg:h-12 lg:w-16 lg:rounded-xl lg:hover:bg-card2 lg:hover:text-ink">News<span id="badgeNews" class="badge hidden bg-gold text-bg"></span></button>
      <button data-nav="lainnya" class="nav-item lg:h-12 lg:w-16 lg:rounded-xl lg:hover:bg-card2 lg:hover:text-ink">Lainnya</button>
    </div>
  </nav>

  <script type="module" src="/ui-baru/js/monitoring.js?v={{VER}}"></script>
</body>
</html>
