<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Harga Emas Realtime | PemulaOLD</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
  <meta name="apple-mobile-web-app-title" content="Harga PemulaOLD">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://s3.tradingview.com" crossorigin>
  <link rel="preconnect" href="https://www.tradingview-widget.com" crossorigin>
  <link rel="dns-prefetch" href="https://data.tradingview.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/ui-baru/dist/app.css?v={{VER}}">
  <!-- semua modul diunduh sekaligus sejak awal (tidak menunggu berantai) -->
  <link rel="modulepreload" href="/ui-baru/js/monitoring.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/api.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/defaults.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/state.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/sound.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/history.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/chart.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/news.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/tour.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/install.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/monitoring/menu.js?v={{VER}}">
  <link rel="modulepreload" href="/ui-baru/js/payment.js?v={{VER}}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('goldmonitor_theme')||'dark'}catch(e){}</script>
  <!--SESSION_BOOT-->
</head>
<body class="loading-data min-h-screen pb-[env(safe-area-inset-bottom)]">

  <!-- ============================== BAR ATAS ============================== -->
  <header class="sticky top-0 z-30 border-b border-line/[0.07] bg-bg/90 backdrop-blur-xl" style="padding-top: env(safe-area-inset-top)">
    <div class="mx-auto flex max-w-[1400px] items-center min-[1600px]:max-w-[min(96vw,1920px)] gap-2.5 px-3 py-1.5 lg:gap-3 lg:px-4 lg:py-2.5">
      <div class="relative shrink-0">
        <svg viewBox="0 0 24 24" class="h-7 w-7 lg:h-8 lg:w-8" aria-hidden="true"><rect x="4.5" y="3" width="3.75" height="18" rx="0.75" fill="#f7931a"/><rect x="10.1" y="4.9" width="8.25" height="8.25" rx="1.1" fill="none" stroke="#f7931a" stroke-width="3.4"/></svg>
        <span id="liveDot" class="absolute -right-0.5 -top-0.5 h-2.5 w-2.5 rounded-full bg-up ring-2 ring-bg" title="Data live"></span>
      </div>
      <div id="brandBox" class="relative min-w-0 flex-1 leading-tight">
        <div class="truncate text-sm font-extrabold lg:text-[15px]">Harga PemulaOLD</div>
        <div class="flex min-w-0 items-center gap-1.5">
          <button id="sisaHari" class="hidden shrink-0 items-center gap-1.5 whitespace-nowrap text-[11px] font-semibold"></button>
          <span id="clkDate" class="truncate whitespace-nowrap text-[11px] text-muted">&nbsp;</span>
        </div>
      </div>
      <!-- desktop: Promo / News / Lainnya pindah ke sini (menu bawah disembunyikan) -->
      <div id="topNav" class="flex items-center gap-0.5 lg:gap-1"></div>
      <button id="btnLayout" class="icon-btn h-9 w-9 text-muted lg:h-10 lg:w-auto lg:gap-1.5 lg:px-3 lg:text-xs lg:font-semibold" title="Tata letak: pilih harga / grafik / riwayat" aria-label="Tata letak"></button>
      <button id="btnAdminWa" class="hidden icon-btn h-9 w-9 border-up/30 bg-up/10 text-up lg:h-10 lg:w-10" aria-label="Hubungi admin lewat WhatsApp"></button>
    </div>
  </header>

  <main class="mx-auto max-w-[1400px] min-[1600px]:max-w-[min(96vw,1920px)] px-2.5 pt-2 lg:px-4 lg:pt-3">
    <!-- pemberitahuan dari admin -->
    <div id="notifs" class="mb-2 flex flex-col gap-2 empty:hidden"></div>

    <!-- HP: harga + nominal + grafik muat dalam satu layar. Desktop: harga di atas, grafik selebar layar, lalu riwayat -->
    <div class="grid grid-cols-1 gap-2 lg:gap-4">
      <!-- ============================== KOLOM KIRI ============================== -->
      <div class="flex min-w-0 flex-col gap-2 lg:gap-4">

        <!-- HARGA UTAMA: semua isi kartu rata tengah dan kotak kecil berukuran sama -->
        <section id="sec-harga" class="card min-w-0 p-2 lg:grid lg:grid-cols-[minmax(0,1fr)_minmax(0,0.95fr)_minmax(0,1.25fr)] lg:items-center lg:gap-x-5 lg:px-4 lg:py-3" aria-label="Harga emas">
          <div class="grid grid-cols-2 gap-1.5 lg:col-start-1 lg:row-start-1 lg:gap-2">
            <div id="buyCard" class="price-tile tile min-w-0 overflow-hidden px-2 py-1.5 text-center lg:px-3 lg:py-2">
              <div class="flex items-center justify-center gap-1.5"><span class="label flex items-center gap-1 text-[10px]">Beli</span><span id="buyChange" class="hidden"></span></div>
              <div class="price-big num whitespace-nowrap font-mono text-[clamp(1rem,4.9vw,1.6rem)] font-extrabold leading-tight tracking-tight"><span class="mr-0.5 text-[0.55em] font-semibold text-muted">Rp</span><span id="buyPrice">—</span></div>
            </div>
            <div id="sellCard" class="price-tile tile min-w-0 overflow-hidden px-2 py-1.5 text-center lg:px-3 lg:py-2">
              <div class="flex items-center justify-center gap-1.5"><span class="label flex items-center gap-1 text-[10px]">Jual</span><span id="sellChange" class="hidden"></span></div>
              <div class="price-big num whitespace-nowrap font-mono text-[clamp(1rem,4.9vw,1.6rem)] font-extrabold leading-tight tracking-tight"><span class="mr-0.5 text-[0.55em] font-semibold text-muted">Rp</span><span id="sellPrice">—</span></div>
            </div>
          </div>

          <!-- jam + status promo -->
          <div id="clockRow" class="mt-2 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 lg:col-start-1 lg:row-start-2">
            <div id="clockBox" class="clock-pill" title="Jam WIB"><span id="clockNum" class="num font-mono text-[1.6rem] font-extrabold leading-none lg:text-[2rem]"><span id="clkH">--</span><span class="clk-colon">:</span><span id="clkM">--</span><span class="clk-sec"><span class="clk-colon">:</span><span id="clkS" class="text-gold">--</span></span></span></div>
            <span id="promoStatus" class="pill shrink-0 bg-line/10 px-2 py-0.5 text-[11px] text-muted" title="Status promo">PROMO —</span>
          </div>

          <!-- info harga: kotak seragam 3 per baris; sisa di baris terakhir di tengah -->
          <div id="chips" class="mt-2 flex flex-wrap justify-center gap-1 lg:col-start-2 lg:row-span-2 lg:row-start-1 lg:mt-0">
            <div id="chipUsd" class="stat"><span class="stat-k" title="Kurs USD/IDR"><span class="lbl-s">IDR</span><span class="lbl-l">USD/IDR</span> <span id="usdIdrChange" class="hidden"></span></span><span id="usdIdr" class="stat-v">—</span></div>
            <div id="chipHigh" class="stat" title="Harga beli tertinggi hari ini"><span class="stat-k"><span class="lbl-s">Max</span><span class="lbl-l">Tertinggi</span></span><span id="dayHigh" class="stat-v text-up">—</span></div>
            <div id="chipLow" class="stat" title="Harga beli terendah hari ini"><span class="stat-k"><span class="lbl-s">Min</span><span class="lbl-l">Terendah</span></span><span id="dayLow" class="stat-v text-down">—</span></div>
            <div id="chipLimit" class="stat hidden"><span class="stat-k">Limit</span><span id="limitVal" class="stat-v text-gold"></span></div>
            <div id="chipMarkup" class="stat hidden"><span id="markupLabel" class="stat-k">Markup</span><span id="markupVal" class="stat-v text-gold"></span></div>
            <div id="chipSpread" class="stat" title="Spread"><span class="stat-k">Spread</span><span id="spreadVal" class="stat-v">—</span></div>
            <div id="chipOn" class="stat hidden"><span id="onLabel" class="stat-k">Titik ON</span><span id="lowestOnVal" class="stat-v text-up"></span></div>
          </div>

          <!-- untung per nominal -->
          <div id="nomWrap" class="mt-2 border-t border-dashed border-line/[0.12] pt-1.5 lg:col-start-3 lg:row-span-2 lg:row-start-1 lg:mt-0 lg:border-l lg:border-t-0 lg:pl-5 lg:pt-0">
            <div class="relative mb-1 text-center">
              <h2 class="label text-[10px] lg:text-[11px]">Untung per nominal</h2>
              <button id="btnNominal" class="absolute right-0.5 top-1/2 -translate-y-1/2 text-[11px] font-semibold text-gold">Atur</button>
            </div>
            <div id="nominals" class="flex flex-wrap justify-center gap-1 lg:gap-2">
              <div class="skel h-6 w-24"></div><div class="skel h-6 w-24"></div><div class="skel h-6 w-24"></div>
            </div>
          </div>
        </section>

      </div>

      <!-- ============================== GRAFIK + RIWAYAT ============================== -->
      <!-- Tata letak dipilih user (diingat per perangkat), lihat LAYOUTS di monitoring.js -->
      <div id="chartHistWrap" class="flex min-w-0 flex-col gap-2 lg:gap-4">
        <!-- GRAFIK: di HP mengisi sisa layar (diatur monitoring.js) -->
        <section id="sec-grafik" class="card overflow-hidden" aria-label="Grafik XAU/USD">
          <div class="hidden items-center justify-between px-4 py-3 lg:flex">
            <h2 class="label mr-auto">Grafik XAU/USD</h2>
            <button id="btnIndicator" class="text-xs font-semibold text-gold">Indikator</button>
          </div>
          <div id="tvChart" class="h-[360px] bg-card2 lg:h-[calc(100vh-190px)] lg:border-t lg:border-line/[0.07]"></div>
        </section>

        <!-- RIWAYAT -->
        <div id="histWrap" class="min-w-0">
        <section id="sec-riwayat" class="card overflow-hidden" aria-label="Riwayat perubahan harga">
          <div class="flex items-center gap-2 px-3 py-1 lg:gap-3 lg:px-4">
            <h2 class="label mr-auto min-w-0 truncate"><span class="lg:hidden">Riwayat</span><span class="hidden lg:inline">Riwayat perubahan</span></h2>
            <button id="btnHistSize" class="icon-btn h-7 w-7 shrink-0 text-muted" title="Pengaturan riwayat (ukuran teks, USD/IDR)" aria-label="Pengaturan riwayat"></button>
            <div class="seg shrink-0" id="histMode">
              <button data-mode="price" aria-pressed="true"><span class="lg:hidden">Emas</span><span class="hidden lg:inline">Harga emas</span></button>
              <button data-mode="usdidr" aria-pressed="false">USD/IDR</button>
            </div>
          </div>
          <div id="histScroll" class="overflow-x-auto border-t border-line/[0.07]">
            <table class="w-full min-w-[440px] text-sm">
              <thead id="histHead" class="bg-card2 text-left text-[10px] uppercase tracking-wider text-muted"></thead>
              <tbody id="histBody" class="divide-y divide-line/[0.06]"><tr class="skel-row"><td colspan="20" class="px-3 py-2"><div class="skel h-7 w-full"></div></td></tr><tr class="skel-row"><td colspan="20" class="px-3 py-2"><div class="skel h-7 w-full"></div></td></tr><tr class="skel-row"><td colspan="20" class="px-3 py-2"><div class="skel h-7 w-full"></div></td></tr></tbody>
            </table>
          </div>
          <div id="histPager" class="flex items-center justify-between gap-2 border-t border-line/[0.07] px-3 py-1 text-[11px] lg:px-4 lg:text-xs">
            <button id="histNewer" class="btn-ghost px-2.5 py-1 text-[11px] lg:px-3 lg:text-xs">Lebih baru</button>
            <span id="histInfo" class="text-center text-muted"></span>
            <button id="histOlder" class="btn-ghost px-2.5 py-1 text-[11px] lg:px-3 lg:text-xs">Lebih lama</button>
          </div>
        </section>
        </div>
      </div>
    </div>
  </main>

  <!-- ============================== NAVIGASI BAWAH ============================== -->
  <nav id="bottomNav" class="hidden border-t border-line/[0.08] bg-card/95 backdrop-blur-xl" style="padding-bottom: env(safe-area-inset-bottom)" aria-label="Navigasi">
    <div class="mx-auto grid h-11 max-w-xl grid-cols-5">
      <button data-nav="harga" class="nav-item">Harga</button>
      <button data-nav="grafik" class="nav-item">Grafik</button>
      <button data-nav="promo" class="nav-item lg:h-12 lg:w-16 lg:rounded-xl lg:hover:bg-card2 lg:hover:text-ink">Promo<span id="badgePromo" class="badge hidden"></span></button>
      <button data-nav="news" class="nav-item lg:h-12 lg:w-16 lg:rounded-xl lg:hover:bg-card2 lg:hover:text-ink">News<span id="badgeNews" class="badge hidden bg-gold text-bg"></span></button>
      <button data-nav="lainnya" class="nav-item lg:h-12 lg:w-16 lg:rounded-xl lg:hover:bg-card2 lg:hover:text-ink">Lainnya</button>
    </div>
  </nav>

  <script type="module" src="/ui-baru/js/monitoring.js?v={{VER}}"></script>
</body>
</html>
