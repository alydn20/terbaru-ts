<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Harga Emas — PemulaOLD</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/ui-baru/dist/app.css?v={{VER}}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('goldmonitor_theme')||'dark'}catch(e){}</script>
  <!--SESSION_BOOT-->
</head>
<body class="min-h-screen pb-[calc(76px+env(safe-area-inset-bottom))]">

  <!-- ============================== BAR ATAS ============================== -->
  <header class="sticky top-0 z-30 border-b border-line/[0.07] bg-bg/90 backdrop-blur-xl" style="padding-top: env(safe-area-inset-top)">
    <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-2.5">
      <div class="relative shrink-0">
        <svg viewBox="0 0 24 24" class="h-8 w-8" aria-hidden="true"><rect x="7" y="1" width="16" height="16" rx="4" fill="#f7931a"/><path d="M1 23V9a13 13 0 0 1 13 14Z" fill="#c97a10" opacity=".9"/></svg>
        <span id="liveDot" class="absolute -right-0.5 -top-0.5 h-2.5 w-2.5 rounded-full bg-up ring-2 ring-bg" title="Data live"></span>
      </div>
      <div class="min-w-0 flex-1 leading-tight">
        <div class="truncate text-[15px] font-extrabold">Harga PemulaOLD</div>
        <button id="sisaHari" class="mt-0.5 hidden items-center gap-1.5 text-xs font-semibold"></button>
      </div>
      <button id="btnAdminWa" class="icon-btn border-up/30 bg-up/10 text-up" aria-label="Hubungi admin lewat WhatsApp"></button>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 pt-3">
    <!-- pemberitahuan dari admin -->
    <div id="notifs" class="mb-3 flex flex-col gap-2 empty:hidden"></div>

    <div class="grid gap-4 lg:grid-cols-[420px_1fr] lg:items-start">
      <!-- ============================== KOLOM KIRI ============================== -->
      <div class="flex flex-col gap-4 lg:sticky lg:top-[72px]">

        <!-- HARGA UTAMA -->
        <section id="sec-harga" class="card p-4" aria-label="Harga emas">
          <div class="grid grid-cols-2 gap-2.5">
            <div id="buyCard" class="tile border-t-[3px] border-t-up p-3">
              <div class="label">Beli</div>
              <div class="num mt-1 whitespace-nowrap font-mono text-[clamp(1.2rem,5.4vw,1.6rem)] font-extrabold tracking-tight"><span class="mr-0.5 text-[0.55em] font-semibold text-muted">Rp</span><span id="buyPrice">—</span></div>
              <span id="buyChange" class="mt-1.5 hidden"></span>
            </div>
            <div id="sellCard" class="tile border-t-[3px] border-t-sky p-3">
              <div class="label">Jual</div>
              <div class="num mt-1 whitespace-nowrap font-mono text-[clamp(1.2rem,5.4vw,1.6rem)] font-extrabold tracking-tight"><span class="mr-0.5 text-[0.55em] font-semibold text-muted">Rp</span><span id="sellPrice">—</span></div>
              <span id="sellChange" class="mt-1.5 hidden"></span>
            </div>
          </div>

          <div class="mt-2.5 grid grid-cols-3 gap-2">
            <div class="tile px-2.5 py-2">
              <div class="label text-[10px]">USD/IDR</div>
              <div class="num font-mono text-sm font-bold text-sky" id="usdIdr">—</div>
              <span id="usdIdrChange" class="hidden"></span>
            </div>
            <div class="tile px-2.5 py-2">
              <div class="label text-[10px]">Tertinggi</div>
              <div class="num font-mono text-sm font-bold text-up" id="dayHigh">—</div>
            </div>
            <div class="tile px-2.5 py-2">
              <div class="label text-[10px]">Terendah</div>
              <div class="num font-mono text-sm font-bold text-down" id="dayLow">—</div>
            </div>
          </div>

          <!-- jam & status -->
          <div class="mt-3 flex items-center gap-3 border-t border-dashed border-line/[0.12] pt-3">
            <div class="min-w-0 flex-1">
              <div class="num font-mono text-2xl font-extrabold leading-none"><span id="clkH">--</span>:<span id="clkM">--</span>:<span id="clkS">--</span></div>
              <div id="clkDate" class="mt-1 truncate text-xs text-muted">&nbsp;</div>
            </div>
            <div id="promoStatus" class="pill bg-line/10 px-3 py-1.5 text-sm text-muted" title="Status promo">PROMO —</div>
          </div>
          <div id="chips" class="mt-3 flex flex-wrap gap-1.5">
            <span id="chipLimit" class="chip hidden"><span class="text-[10px] tracking-wider text-muted">LIMIT</span><span id="limitVal" class="num text-gold"></span></span>
            <span id="chipMarkup" class="chip hidden"><span id="markupLabel" class="text-[10px] tracking-wider text-muted">MARKUP</span><span id="markupVal" class="num text-gold"></span></span>
            <span id="chipSpread" class="chip"><span class="text-[10px] tracking-wider text-muted">SPREAD</span><span id="spreadVal" class="num">—</span></span>
            <span id="chipOn" class="chip hidden"><span class="text-[10px] tracking-wider text-muted">TITIK ON</span><span id="lowestOnVal" class="num text-up"></span></span>
          </div>
        </section>

        <!-- UNTUNG PER NOMINAL -->
        <section class="card p-4" aria-label="Untung per nominal">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="label">Untung per nominal</h2>
            <button id="btnNominal" class="text-xs font-semibold text-gold">Atur</button>
          </div>
          <div id="nominals" class="grid grid-cols-2 gap-2">
            <div class="col-span-2 py-4 text-center text-sm text-muted">Memuat...</div>
          </div>
        </section>
      </div>

      <!-- ============================== KOLOM KANAN ============================== -->
      <div class="flex min-w-0 flex-col gap-4">
        <!-- GRAFIK -->
        <section id="sec-grafik" class="card overflow-hidden" aria-label="Grafik XAU/USD">
          <div class="flex items-center justify-between px-4 py-3">
            <h2 class="label">Grafik XAU/USD</h2>
            <button id="btnIndicator" class="text-xs font-semibold text-gold">Indikator</button>
          </div>
          <div id="tvChart" class="h-[min(62vh,520px)] border-t border-line/[0.07] bg-card2"></div>
        </section>

        <!-- RIWAYAT -->
        <section id="sec-riwayat" class="card overflow-hidden" aria-label="Riwayat perubahan harga">
          <div class="flex flex-wrap items-center gap-3 px-4 py-3">
            <h2 class="label mr-auto">Riwayat perubahan</h2>
            <div class="seg" id="histMode">
              <button data-mode="price" aria-pressed="true">Harga emas</button>
              <button data-mode="usdidr" aria-pressed="false">USD/IDR</button>
            </div>
          </div>
          <div class="overflow-x-auto border-t border-line/[0.07]">
            <table class="w-full min-w-[440px] text-sm">
              <thead id="histHead" class="bg-card2 text-left text-[10px] uppercase tracking-wider text-muted"></thead>
              <tbody id="histBody" class="divide-y divide-line/[0.06]"></tbody>
            </table>
          </div>
          <div id="histPager" class="flex items-center justify-between gap-2 border-t border-line/[0.07] px-4 py-3 text-xs">
            <button id="histNewer" class="btn-ghost px-3 py-2 text-xs">Lebih baru</button>
            <span id="histInfo" class="text-muted"></span>
            <button id="histOlder" class="btn-ghost px-3 py-2 text-xs">Lebih lama</button>
          </div>
        </section>
      </div>
    </div>
    <p class="py-6 text-center text-[11px] text-muted">PemulaOLD · Harga emas realtime</p>
  </main>

  <!-- ============================== NAVIGASI BAWAH ============================== -->
  <nav id="bottomNav" class="fixed inset-x-0 bottom-0 z-30 border-t border-line/[0.08] bg-card/95 backdrop-blur-xl" style="padding-bottom: env(safe-area-inset-bottom)" aria-label="Navigasi">
    <div class="mx-auto grid h-16 max-w-xl grid-cols-5">
      <button data-nav="harga" class="nav-item">Harga</button>
      <button data-nav="grafik" class="nav-item">Grafik</button>
      <button data-nav="promo" class="nav-item">Promo<span id="badgePromo" class="badge hidden"></span></button>
      <button data-nav="news" class="nav-item">News<span id="badgeNews" class="badge hidden bg-gold text-black"></span></button>
      <button data-nav="lainnya" class="nav-item">Lainnya</button>
    </div>
  </nav>

  <script type="module" src="/ui-baru/js/monitoring.js?v={{VER}}"></script>
</body>
</html>
